spring:
  application:
    name: todo-list

  # Base de datos H2 en archivo (los datos persisten entre reinicios)
  datasource:
    url: jdbc:h2:file:./data/tododb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update   # "update" crea las tablas si no existen; no borra datos
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Consola web de H2: http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: ON_PARAM

logging:
  level:
    root: INFO
    todoapp: DEBUG
    org.hibernate.SQL: DEBUG

# Documentación Swagger: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
